name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Setup
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          YOLO_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          YOLO_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "yolo-team-signing.pfx"
          if ($env:WINDOWS_SIGNING_CERT_BASE64) {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            $env:YOLO_SIGN_PFX = $certificatePath
          }
          if ($env:GITHUB_REF -like "refs/tags/*") { $env:YOLO_REQUIRE_SIGNING = "1" }
          .\installer\windows\build-installer.ps1

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "yolo-team-signing.pfx"
          if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.ref_name }}
          path: dist/YOLO-Team-Training-Platform-Setup-*.exe
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem -LiteralPath dist -Filter "YOLO-Team-Training-Platform-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "Installer not found." }
          & gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            & gh release upload $tag $installer.FullName --clobber
          } else {
            $releaseArgs = @(
              "release", "create", $tag, $installer.FullName,
              "--title", "YOLO团队训练平台 $tag",
              "--generate-notes"
            )
            if ($tag.Contains("-")) { $releaseArgs += "--prerelease" }
            & gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publishing failed." }
