name: 问题报告
description: 报告安装、训练、标注、导出或测试问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 问题环节
      options: [Windows 安装, Ubuntu 安装, 数据导入, 半自动标注, 模型训练, 模型导出, 目标设备部署, 模型测试]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 系统、Python、GPU/板卡、项目版本和相关依赖版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 完整错误与日志
      description: 请先移除账号、IP、密钥和私人数据
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
